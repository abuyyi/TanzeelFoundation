{% extends "admin/base.html" %}
{% load i18n static %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.5px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        <span>Tanzeel Foundation</span>
    </a>
</div>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Styling overrides for user dropdown display states */
    .dropdown-menu.active {
        display: block !important;
        animation: dropFade 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    @keyframes dropFade {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
